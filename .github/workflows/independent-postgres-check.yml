name: Independent PostgreSQL migration checks

on:
  push:
    branches:
      - migration/independent-postgres
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile the existing lockfile
        run: npm install --package-lock-only --legacy-peer-deps
      - name: Commit repaired lockfile on migration branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/migration/independent-postgres'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'Repair npm lockfile for independent migration'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build application
        run: npm run build
